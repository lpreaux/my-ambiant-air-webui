<section
  class="py-8 px-4 mx-auto max-w-screen-xl text-center lg:py-16 z-10 relative">
  <h1
    class="mb-4 text-4xl font-extrabold tracking-tight leading-none text-gray-900 md:text-5xl lg:text-6xl dark:text-white">
    {{ category?.name }}
  </h1>
</section>
<section
  class="py-8 px-4 mx-auto max-w-screen-xl text-center lg:py-16 z-10 relative">
  <app-table
    *ngIf="paginatedThreads() as paginatedThreads"
    showFooter
    [options]="tableOptions"
    [data]="paginatedThreads"
    (rowClicked)="onThreadSelected($event)"
    (pageSelected)="onPageSelected($event)"></app-table>
</section>
